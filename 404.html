<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Страница не найдена — BARBER HOUSE</title>
  <meta name="robots" content="noindex">
  <!--
    GitHub Pages показывает этот файл для любого несуществующего адреса,
    в том числе вложенного (/barber-house/a/b/c). Относительные пути к CSS
    там бы сломались, поэтому стили встроены прямо в страницу.
    Ссылка «На главную» рассчитана на репозиторий barber-house:
    если репозиторий будет назван иначе — поменять href.
  -->
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: #0E0E0E;
      color: #EDEDED;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    h1 {
      margin: 0 0 8px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 64px;
      color: #C9A54C;
    }
    a {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 28px;
      border: 1px solid #C9A54C;
      color: #C9A54C;
      text-decoration: none;
    }
    a:hover,
    a:focus-visible {
      background: #C9A54C;
      color: #0E0E0E;
    }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>Такой страницы нет. Возможно, ссылка устарела или в адресе опечатка.</p>
    <a href="/barber-house/">На главную</a>
  </main>
</body>
</html>
